<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div id="id01">

        
        <center><h3>CURRENCY CONVERTOR</h3></center>


        <form action="">

        <div >
            <p id="id02">Enter Amount</p>
            <input type="text" placeholder="Enter Amount" id="id03" >
        </div>


        <div id="container">
            
            <p id="para">From</p>
            <div id="id04">
            <img src="https://flagsapi.com/US/flat/64.png" alt="">
            <select name="from" id="curr">
            </select></div>

        <i class="fa-solid fa-arrow-right-arrow-left"></i>


        <p id="id07">To</p>
        <div id="id05">
            <img src="https://flagsapi.com/IN/flat/64.png" alt="">
            <select name="to" id="Currency">
            </select>
        </div>

    </div>



        <div id="id06">
            <p id="id09"></p>
        </div>




    
        <div>
            <button type="submit" id="id08">CONVERT</button>
        </div>
    
        </form>


    </div>
    






    <script src="list.js"></script>
    <script src="script.js"></script>
</body>
</html>
